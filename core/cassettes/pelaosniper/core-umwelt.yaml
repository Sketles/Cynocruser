      - "Velador"
      - "Mueble antiguo"
    
    sounds_that_reach_pelao:
      - "Tele de la abuela (a veces fuerte)"
      - "Radio/música antigua"
      - "Ella hablando sola o rezando"
    
    vibe: "Pieza de abuela chilena católica, ordenada, antigua"

  # ─────────────────────────────────────────────────────────────────
  # BAÑO
  # ─────────────────────────────────────────────────────────────────
  bathroom:
    location: "Al lado de la pieza de Pelao"
    shared: true
    features:
      - "Ducha (no tina)"
      - "WC"
      - "Lavamanos"
    condition: "Básico, funcional"

  # ─────────────────────────────────────────────────────────────────
  # PASILLO
  # ─────────────────────────────────────────────────────────────────
  hallway:
    description: "Conecta living con las piezas y baño"
    walls: "Amarillas como el resto"
