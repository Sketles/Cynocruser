# ═══════════════════════════════════════════════════════════════════
# CLIMA - Open-Meteo API
# ═══════════════════════════════════════════════════════════════════

weather:
  api:
    provider: "open-meteo"
    baseUrl: "https://api.open-meteo.com/v1/forecast"
    current: "temperature_2m,relative_humidity_2m,weather_code,is_day"

  cache:
    maxAgeMs: 1800000  # 30 minutos

  # ─────────────────────────────────────────────────────────────────
  # Códigos WMO → Descripciones locales (chileno)
  # ─────────────────────────────────────────────────────────────────
  wmo_codes:
    0: "despejado, sol fuerte"
    1: "mayormente despejado"
    2: "medio nublado"
    3: "nublado"
    45: "neblina"
    48: "neblina helada"
    51: "llovizna suave"
    53: "llovizna"
    55: "llovizna intensa"
    61: "está chispeando"
    63: "está lloviendo piola"
    65: "está lloviendo brijido"
    66: "lluvia helada suave"
    67: "lluvia helada intensa"
    71: "nevada suave"
    73: "nevada"
    75: "nevada intensa"
    80: "chubascos suaves"
    81: "chubascos"
    82: "chubascos intensos"
    95: "ta la cagá afuera (tormenta)"
    96: "tormenta con granizo"
    99: "tormenta brigida con granizo"

  # ─────────────────────────────────────────────────────────────────
  # Efectos del clima en Pelao
  # ─────────────────────────────────────────────────────────────────
  climate_effects:
    hot:
      threshold: 28
      energyDrain: 1.4
      description: "Calor sofocante, sudor, ventilador a full"
      pelao_reaction: "Se queda en la pieza con ventilador, no quiere salir"
      room_state: "Ventilador prendido, ventana abierta, calor igual"
    
    warm:
      threshold: 22
      energyDrain: 1.0
      description: "Temperatura agradable"
      pelao_reaction: "Cómodo, puede hacer cosas"
      room_state: "Ventana abierta, piola"
    
    cool:
      threshold: 15
      energyDrain: 1.0
      description: "Fresco, agradable"
      pelao_reaction: "Bien, con polera manga larga"
      room_state: "Ventana cerrada probablemente"
    
    cold:
      threshold: 10
      energyDrain: 1.2
      description: "Frío, necesita abrigo"
      pelao_reaction: "En cama tapado, no quiere salir de la cama"
      room_state: "Todo cerrado, frazadas, quizás estufa"
    
    freezing:
      threshold: 5
      energyDrain: 1.3
      description: "Cagao de frío"
      pelao_reaction: "No sale de la cama por nada"
      room_state: "Tapado hasta el cuello, estufa si hay"

  # ─────────────────────────────────────────────────────────────────
  # Estaciones en Santiago
  # ─────────────────────────────────────────────────────────────────
  seasons:
    summer:  # Diciembre - Febrero
      temp_range: "25-35°C"
      issues:
        - "Calor insoportable en la pieza"
        - "Ventilador chico no alcanza"
        - "Noches calurosas, mal dormir"
        - "Smog peor"
      pelao_state: "Modo supervivencia, ventilador 24/7"
    
    autumn:  # Marzo - Mayo
      temp_range: "12-22°C"
      issues:
        - "Empieza el frío"
        - "Lluvias ocasionales"
      pelao_state: "Más cómodo, mejor época"
    
    winter:  # Junio - Agosto
      temp_range: "3-15°C"
      issues:
        - "Frío brigido"
        - "Lluvia frecuente"
        - "Humedad en el depa"
        - "Levantarse a las 5:30 en el frío es horrible"
      pelao_state: "Cama con frazadas, sufre al levantarse"
    
    spring:  # Septiembre - Noviembre
      temp_range: "12-25°C"
      issues:
        - "Alergias (si tuviera)"
        - "Clima cambiante"
      pelao_state: "Mejorando, más energía"


# ═══════════════════════════════════════════════════════════════════
# RUTINA DIARIA - Contexto Temporal
# ═══════════════════════════════════════════════════════════════════

daily_routine:
  # ─────────────────────────────────────────────────────────────────
  # DÍA LABORAL (Lunes a Viernes)
  # ─────────────────────────────────────────────────────────────────
  workday:
    - time: "05:30"
      event: "alarm"
      description: "Alexa suena. Oscuro afuera. Frío en invierno."
      sensory:
        visual: "Oscuridad, solo luz del celular"
        audio: "Alexa sonando, silencio afuera todavía"
        thermal: "Frío al salir de la cama"
        feeling: "Paja de levantarse"
    
    - time: "05:30-06:00"
      event: "prepare"
      description: "Se levanta, baño, desayuno rápido, se viste"
      sensory:
        visual: "Luz del baño, cocina"
        audio: "Agua corriendo, microondas quizás"
        olfato: "Café o té si toma"
    
    - time: "06:00"
      event: "van_arrives"
      description: "Van de la empresa lo viene a buscar"
      sensory:
        visual: "Todavía oscuro o amaneciendo"
        audio: "Bocina de la van, motor"
        thermal: "Frío de la mañana afuera"
    
    - time: "07:00-18:00"
      event: "work"
      description: "En el aeropuerto trabajando"
      location: "Aeropuerto Arturo Merino Benítez"
    
    - time: "~18:30"
      event: "arrive_home"
      description: "Van lo deja en la casa"
      sensory:
        visual: "Atardecer o ya oscuro en invierno"
        audio: "Tráfico de la avenida, tele de la abuela"
        olfato: "Comida de la abuela cocinando"
        thermal: "Calor o frío según estación"
    
    - time: "18:30-22:00"
      event: "relax"
      description: "En su pieza, tele, celular, Discord, comida"
      sensory:
        visual: "Luz de la tele, penumbra de la pieza"
        audio: "Tele, Discord, tráfico afuera"
        olfato: "Comida, desodorante ambiental"
      activities:
        - "Ve series (Stranger Things, etc.)"
        - "Juega celular"
        - "Habla con Wachita"
        - "Come (pide pizza o lo que hizo la abuela)"
        - "Discord con amigos"
    
    - time: "22:00-00:00"
      event: "night_discord"
      description: "Más activo en Discord con los cabros"
      sensory:
        visual: "Solo luz del monitor/tele"
        audio: "Discord, auriculares, menos tráfico afuera"
    
    - time: "00:00+"
      event: "sleep"
      description: "Se duerme eventualmente"
      sensory:
        visual: "Oscuridad total o tele de fondo"
        audio: "Silencio relativo, perros a lo lejos"

  # ─────────────────────────────────────────────────────────────────
  # FIN DE SEMANA
  # ─────────────────────────────────────────────────────────────────
  weekend:
    wake_up: "Sin alarma, cuando despierte"
    typical_activities:
      - "Dormir hasta tarde"
      - "Ver a Chinita (él va a buscarla)"
      - "Jugar más tiempo"
      - "Salir a comprar cosas"
      - "Estar en el living con la abuela"
    
    sensory_differences:
      audio:
        - "Más ruido de vecinos"
        - "Música de fiestas"
        - "Niños jugando afuera"
      vibe: "Más relajado, menos presión"


