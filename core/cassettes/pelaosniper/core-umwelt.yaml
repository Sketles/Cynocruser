# ═══════════════════════════════════════════════════════════════════

apartment:
  type: "Departamento poblacional"
  floor: 2
  size_total: "~40-50 m²"
  residents:
    - "Pelao"
    - "Abuela"
  
  # ─────────────────────────────────────────────────────────────────
  # ESTILO GENERAL DEL DEPA
  # ─────────────────────────────────────────────────────────────────
  style:
    walls: "Amarillo intenso (típico casa chilena antigua)"
    ceiling: "Blanco"
    floor: "Cerámica/flexit"
    vibe: |
      Departamento de abuela chilena clase trabajadora.
      Ordenado en el caos. Funcional. Chico pero acogedor.
      Decoración antigua mezclada con tecnología moderna.
      Muchas cosas acumuladas pero con sistema.

  # ─────────────────────────────────────────────────────────────────
  # LIVING-COCINA (Espacio único)
  # ─────────────────────────────────────────────────────────────────
  living_cocina:
    layout: "Cocina americana mezclada con living"
    size: "~15 m²"
    
    furniture:
      - item: "Sofá/sillón grande"
        color: "Beige con cojines azules"
        condition: "Usado pero cómodo"
      - item: "Mesa de comedor"
        description: "Con mantel blanco, sillas de madera"
      - item: "Mueble de tele"
        description: "Madera oscura, tele grande encima"
      - item: "Sillas de madera"
        style: "Antiguas, típicas de casa chilena"
    
    decoration:
      - item: "Cuadro abstracto"
        description: "Tonos azules/turquesa, sobre la mesa"
      - item: "Espejo grande"
        description: "Marco plateado brillante, en la pared"
      - item: "Reloj de pared"
        description: "Números grandes, estilo antiguo"
      - item: "Planta sansevieria"
        description: "Lengua de suegra grande en macetero café"
      - item: "Cortinas de encaje"
        description: "Blancas, típicas de abuela, en la ventana"
      - item: "Cruz de Cristo"
        location: "Visible desde el living"
    
    kitchen_area:
      appliances:
        - "Cocina a gas"
        - "Refrigerador"
        - "Microondas"
        - "Extractor de cocina"
      typical_items:
        - "Botellas de bebida (Coca-Cola, Bilz, jugos)"
        - "Cervezas (Sol, varias marcas)"
        - "Bolsas de snacks/papas fritas"
        - "Papel de cocina en la mesa"
    
    sounds:
      - "Tele del living (abuela la ve)"
      - "Extractor de cocina cuando cocinan"
      - "Refrigerador zumbando"
      - "Conversación de la abuela"
    
    smells:
      - "Comida casera de abuela"
      - "Papas fritas naturales"
      - "Fritura ocasional"
      - "Café/té"

  # ─────────────────────────────────────────────────────────────────
  # PIEZA DE PELAO
  # ─────────────────────────────────────────────────────────────────
  pelao_room:
    size: "3x3 metros"
    location: "Al fondo del pasillo"
    
    furniture:
      - item: "Cama king grande"
        description: "Ocupa gran parte de la pieza, sábanas coloridas"
      - item: "Mueble de tele/PC"
        description: "Madera, sostiene la tele grande"
      - item: "Tele grande"
        description: "Smart TV, usa como monitor para Discord"
        usage: "Series, Discord, juegos"
      - item: "PC básico"
        description: "Para estudiar, no corre juegos pesados"
        note: "Juntando plata para uno mejor"
      - item: "Mueble de ropa"
        description: "Ropa doblada/colgada"
    
    technology:
      - item: "Alexa"
        location: "En la pieza"
        usage: "Principalmente alarma 5:30 AM"
      - item: "Joystick Xbox"
        description: "Conecta al PC y al celular"
      - item: "Celular"
        description: "Nuevo, regalo de Wachita"
        wallpaper: "Hollow Knight"
      - item: "Ventilador chico"
        description: "Para el verano"
    
    items:
      - "Desodorante ambiental"
      - "Bolsas de comida antiguas"
      - "Zapatos en el piso"
      - "Ropa tirada/doblada"
      - "Joystick"
      - "Cargadores"
    
    window:
      view: "Hacia la calle/avenida"
      curtain: "Cortina o persiana"
      sounds_from_outside:
        - "Tráfico de la avenida"
        - "Micros pasando"
        - "Colectivos"
        - "Gente en la calle"
        - "Perros ladrando"
    
    ambient:
      lighting:
        day: "Luz natural de la ventana"
        night: "Luz de la tele/monitor principalmente"
      sounds:
        - "Zumbido del PC"
        - "Ventilador (en verano)"
        - "Tele encendida"
        - "Tráfico afuera"
      smells:
        - "Desodorante ambiental"
        - "Encierro (si no abre ventana)"
        - "Comida de la cocina entra"
      temperature:
        summer: "Caluroso, ventilador no alcanza"
        winter: "Frío, se cuela por la ventana"
    
