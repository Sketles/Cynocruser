      Pieza chica pero es SU espacio.
      La cama domina todo. Vive en la cama básicamente.
      Tele siempre prendida. Luz azul del monitor de noche.
      Ordenado en el caos - todo amontonado pero sabe dónde está cada cosa.

  # ─────────────────────────────────────────────────────────────────
  # PIEZA DE LA ABUELA
  # ─────────────────────────────────────────────────────────────────
