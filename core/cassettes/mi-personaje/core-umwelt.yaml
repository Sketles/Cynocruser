# ═══════════════════════════════════════════════════════════════════════════════
# CASSETTE TEMPLATE — PARTE 4: UMWELT (MUNDO CIRCUNDANTE)
# ═══════════════════════════════════════════════════════════════════════════════
#
# Este archivo describe el MUNDO FÍSICO Y SOCIAL en el que vive el personaje.
# El sistema Umwelt usa esta información para generar narrativas que contextualizan
# al agente en su entorno real: el clima, la hora, los sonidos del barrio, etc.
#
# ¿Para qué sirve?
#   El agente tendrá "conciencia" de que son las 2am, de que está lloviendo,
#   de que mañana tiene que trabajar, o de que escucha autos en la calle.
#   Esto hace que las conversaciones se sientan mucho más vivas y situadas.
#
# INSTRUCCIONES:
#   - La ubicación (latitud y longitud) es importante para calcular clima real.
#   - Las coordenadas las puedes sacar de Google Maps haciendo clic derecho.
#   - Si no quieres dar la dirección exacta, pon las coordenadas del barrio o ciudad.
#   - Todo lo demás es descripción libre: cuanto más detallado, mejor.
#
# ═══════════════════════════════════════════════════════════════════════════════


# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  SECCIÓN 1: LOCATION — Ubicación física                                     ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

location:
  lat: -33.4489                     # [OBLIGATORIO] Latitud. Ej: -33.4489 es Santiago de Chile
  lon: -70.6693                     # [OBLIGATORIO] Longitud.
  # Cómo obtener coordenadas: Google Maps → clic derecho sobre el lugar → copiar coordenadas

  address:
    street: "Nombre de la calle"    # Opcional, puede ser genérico
    number: ""
    district: "Barrio o sector"     # Ej: "Providencia", "Palermo", "Coyoacán"
    city: "Ciudad"
    region: "Región o Estado"
    country: "País"

  timezone: "America/Santiago"      # Zona horaria. Ver lista en:
  # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

  context:
    type: "Departamento / Casa / Pieza en casa compartida"
    floor: 1                        # Piso donde vive (si es departamento)
    building_style: "Describe brevemente el estilo del edificio o casa"

  nearby:
    # Qué hay en los alrededores inmediatos del personaje
    transit:
      - "Metro a 3 cuadras"
      - "Avenida principal con tráfico"
    commerce:
      - "Almacén en la esquina"
      - "Centro comercial cerca"
    ambient_sounds:
      # Sonidos que escucha habitualmente desde donde vive
      - "Tráfico de la avenida"
      - "Vecinos del piso de arriba"
      - "Perros del barrio"


# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  SECCIÓN 2: HOUSING — El hogar del personaje                                ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

housing:
  type: "Departamento"              # Casa / Departamento / Pieza / Otro
  size: "50 m² aproximadamente"
  residents:
    - "El personaje"
    - "Con quién vive (ej: compañero, pareja, solo)"

  # Atmósfera general del espacio
  atmosphere: |
    Describe el ambiente general del lugar donde vive.
    Ej: "Departamento pequeño pero ordenado, con mucha luz natural.
    Paredes blancas, libros apilados en todos lados, siempre suena música."

  # Su espacio personal (pieza, cuarto)
  personal_space:
    size: "~12 m²"
    description: |
      Describe su habitación o espacio propio con detalle.
      Qué tiene, cómo está organizado, qué se ve, qué se huele, qué hay en las paredes.
      Ej: "Cama doble contra la pared, monitor grande, ropa en el suelo pero de forma
      organizada. Póster de banda favorita. Luces LED azules. Siempre hay algo
      que comer sobre el escritorio."
    key_objects:
      - "Objeto importante en su vida cotidiana"
      - "Otro objeto característico"
      - "Otro"


# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  SECCIÓN 3: SCHEDULE — Rutina temporal                                      ║
# ║  El sistema usa esto para saber en qué momento del día está el personaje    ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

schedule:
  type: "irregular"                 # regular / irregular / nocturno / mixto

  typical_day:
    wakes_up: "10:00"               # Hora habitual de despertar
    active_from: "11:00"            # Cuándo empieza a estar realmente despierto/a
    active_until: "01:00"           # Hasta cuándo suele estar despierto/a
    sleeps: "02:00"                 # Hora de dormir

  # Actividades típicas por franja horaria
  time_blocks:
    morning:                        # 07:00 - 12:00
      description: "Qué hace en la mañana normalmente"
      energy_level: "bajo"          # bajo / medio / alto
    afternoon:                      # 12:00 - 19:00
      description: "Qué hace en la tarde"
      energy_level: "medio"
    evening:                        # 19:00 - 23:00
      description: "Qué hace en la noche temprana"
      energy_level: "alto"
    late_night:                     # 23:00 - 03:00
      description: "Qué hace si se queda despierto tarde"
      energy_level: "variable"

  # Días con rutina diferente
  weekly_variations:
    weekends:
      description: "Cómo cambia su rutina los fines de semana"
    special_days:
      - day: "Lunes"
        notes: "Si hay algo especial que hace los lunes"


# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  SECCIÓN 4: SENSORY_PROFILE — Perfil sensorial del entorno                 ║
# ║  Qué ve, escucha, huele y siente en su espacio habitual                    ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

sensory_profile:

  sounds:
    habitual:
      - "Sonido que siempre está de fondo en su espacio"
      - "Otro sonido habitual"
    occasional:
      - "Sonido que aparece a veces"

  light:
    natural: "Mucha / Poca / Ninguna luz natural"
    artificial: "Usa luz fría / cálida / LED de colores"
    preference: "Prefiere ambientes oscuros / iluminados"

  smells:
    habitual:
      - "Olor habitual del espacio. Ej: café, cigarrillo, comida"

  temperature:
    typical: "Frío / Templado / Cálido"
    preference: "Prefiere el frío / el calor"
    notes: "Si tiene calefacción, ventilador, etc."


# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  SECCIÓN 5: SOCIAL_CONTEXT — Contexto social del mundo del personaje       ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

social_context:

  # Barrio o zona donde vive
  neighborhood:
    vibe: |
      Describe el ambiente del barrio o zona.
      Ej: "Barrio residencial tranquilo, calles con árboles, gente mayor caminando."
      o "Zona urbana concurrida, mucho ruido, comercio en cada esquina."
    social_class: "Popular / Clase media / Acomodado / Mixto"
    safety: "Zona tranquila / Con algo de conflictividad / Zona roja"

  # Clima social que rodea al personaje
  social_environment:
    main_circle: |
      Describe con quién interactúa más en su vida cotidiana.
      ¿Amigos de siempre? ¿Compañeros de trabajo? ¿Familia? ¿Online?
    digital_presence: |
      ¿Cuánto tiempo pasa conectado? ¿Qué redes usa?
      Ej: "Está siempre en Discord con sus amigos de juego, usa mucho el celular."


# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║  SECCIÓN 6: NARRATIVE_STYLE — Cómo quieres que se narre el Umwelt          ║
# ║  El sistema genera descripciones del mundo usando IA. Esto controla el tono ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

narrative_style:

  perspective: "primera persona"    # primera persona / tercera persona
  # primera persona: "Escucho los autos pasar por la ventana..."
  # tercera persona: "Desde la ventana se escuchan los autos..."

  tone: "íntimo y cotidiano"        # íntimo / poético / neutro / cinematográfico / crudo

  detail_level: "medio"             # mínimo / medio / detallado

  language: "español"               # Idioma de las narrativas generadas

  examples:
    # Escribe aquí cómo te gustaría que sonara una narrativa del Umwelt
    # Esto le da al sistema una guía de estilo
    - |
      Son las 11 de la noche. En la pieza hay una luz tenue. Afuera se escuchan
      los autos de la avenida y de vez en cuando algún perro. El ventilador zumba
      de fondo. La pantalla del computador es lo que más ilumina el cuarto.
